name: CI - Build e Testes

on:
  push:
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, executar os testes (JUnit 5 + MockMvc) e gerar o jar
        run: mvn -B clean verify

      - name: Guardar o jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: monitoramento-jar
          path: target/*.jar
          if-no-files-found: error
